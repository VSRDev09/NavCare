services:
  navcare-db:
    image: postgres:16-alpine
    container_name: navcare-db
    environment:
      POSTGRES_DB: navcare
      POSTGRES_USER: navcare
      POSTGRES_PASSWORD: navcare
    ports:
      - "5432:5432"
    volumes:
      - navcare_postgres_data:/var/lib/postgresql/data

  navcare-backend:
    build:
      context: ./backend
    container_name: navcare-backend
    depends_on:
      - navcare-db
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://navcare-db:5432/navcare
      NAVCARE_CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8081:8081"

  navcare-frontend:
    build:
      context: ./frontend
    container_name: navcare-frontend
    depends_on:
      - navcare-backend
    ports:
      - "4200:80"

volumes:
  navcare_postgres_data:
