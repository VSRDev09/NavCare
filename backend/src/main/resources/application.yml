spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: Nav.Care
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/navcare}
    username: ${DB_USERNAME:navcare}
    password: ${DB_PASSWORD:navcare}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: ${SERVER_PORT:8081}

navcare:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:20}
  security:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:}
    jwt-secret: ${JWT_SECRET:navcare-local-dev-secret-change-me}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /v3/api-docs
